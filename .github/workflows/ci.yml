name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            .config/dotnet-tools.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/RouteTrace.Web/package-lock.json

      - name: Restore frontend dependencies
        working-directory: src/RouteTrace.Web
        run: npm ci

      - name: Restore
        run: dotnet restore RouteTrace.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet format RouteTrace.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build RouteTrace.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test RouteTrace.slnx -c Release --no-build
          --logger trx
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Publish test results
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        with:
          name: .NET tests
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
          use-actions-summary: true

      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: >-
          dotnet reportgenerator
          -reports:"artifacts/test-results/**/coverage.cobertura.xml"
          -targetdir:"artifacts/coverage"
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"

      - name: Add coverage to job summary
        if: ${{ !cancelled() }}
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            artifacts/test-results/**/*.trx
            artifacts/coverage
          if-no-files-found: error
          retention-days: 14

      - name: Publish static application
        run: dotnet publish src/RouteTrace.Web/RouteTrace.Web.csproj -c Release --no-restore
